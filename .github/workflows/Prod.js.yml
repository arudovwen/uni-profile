# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Production CI/CD

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:

    runs-on: [prod]

    strategy:
      matrix:
        node-version: [20.x]
        os: [windows-latest]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    #- run: npm install -f
    - run: npm run generate --if-present
    #- run: npm test 
    
    - name: Archive production artifacts (Windows)
      run: |
            Copy-Item -Path C:\actions-runner\profile\_work\Universal.Profile.Frontend\Universal.Profile.Frontend\.output\public\* -Destination C:\inetpub\wwwroot\Profile.FrontEnd\ -recurse -Force

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
          name: deployable-package
          path: C:\build\deployable-package.zip
